<header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between py-3 gap-3">
      <a href="/" class="flex items-center space-x-3 group">
        <span class="w-9 h-9 rounded-xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center text-lg">🛡️</span>
        <div>
          <div class="font-bold text-sm tracking-tight text-white group-hover:text-blue-300 transition-colors">
            CompanyVerificator
          </div>
          <div class="text-[11px] text-slate-400">
            AML • Compliance • Należyta Staranność
          </div>
        </div>
      </a>

      <nav class="flex flex-wrap items-center gap-1.5 text-xs font-semibold">
        <a href="/"
           class="px-3 py-1.5 rounded-lg transition-colors {% if active_tab == 'verify' %}bg-blue-600 text-white shadow-xs{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
          🔍 Weryfikacja firmy
        </a>
        <a href="/wsadowa"
           class="px-3 py-1.5 rounded-lg transition-colors {% if active_tab == 'batch' %}bg-blue-600 text-white shadow-xs{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
          📥 Weryfikacja wsadowa
        </a>
        <a href="/historia"
           class="px-3 py-1.5 rounded-lg transition-colors {% if active_tab == 'history' %}bg-blue-600 text-white shadow-xs{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
          📋 Rejestr i historia ({{ stats.total }})
        </a>
        <a href="/rejestry"
           class="px-3 py-1.5 rounded-lg transition-colors {% if active_tab == 'registries' %}bg-blue-600 text-white shadow-xs{% else %}text-slate-300 hover:bg-slate-800 hover:text-white{% endif %}">
          🏛️ Rejestry i sankcje
        </a>
      </nav>
    </div>
  </div>
</header>
