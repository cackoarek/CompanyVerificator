[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "company-verificator"
version = "0.1.0"
description = "CompanyVerificator - Aplikacja Webowa Compliance, AML i Należytej Staranności Kontrahentów"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["aml", "compliance", "due-diligence", "biala-lista", "krs", "crbr", "sanctions", "fastapi"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.1",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.web" = [
    "templates/**/*.html",
    "static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "venv",
    "data",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = [
    "venv",
    ".venv",
    "data",
    "build",
    "dist",
]
